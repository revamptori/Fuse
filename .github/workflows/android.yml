name: Android
on:
  push:
    branches: ["arena/5a35d0f9-fuse", main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    name: APK build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: android
      - name: gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: sdk packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: build
        run: ./scripts/ci-android.sh
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$([ "${{ job.status }}" = success ] && echo pass || echo fail)
          ./scripts/ci-report.sh android "Android APK build" ci-android.log "$status"
      - name: upload apks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuss-apks
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logs
          path: ci-android.log
          if-no-files-found: ignore
