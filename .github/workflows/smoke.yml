name: smoke
on:
  push:
    branches: ["arena/5a35d0f9-fuse"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: environment
        run: |
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo '--- sdk root'; ls "$ANDROID_HOME"
            echo '--- ndk'; ls "$ANDROID_HOME/ndk" 2>&1
            echo '--- platforms'; ls "$ANDROID_HOME/platforms" 2>&1
            echo '--- build-tools'; ls "$ANDROID_HOME/build-tools" 2>&1
            echo '--- java'; java -version 2>&1
            echo '--- gradle'; which gradle; gradle --version 2>&1 | head -5
          } > /tmp/env.txt 2>&1
          cat /tmp/env.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: rust + targets
        run: |
          cargo --version; rustc --version
          rustup target list --installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: env-probe
          path: /tmp/env.txt
