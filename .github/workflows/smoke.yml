name: smoke
on:
  push:
    branches: ["arena/5a35d0f9-fuse"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: environment
        run: |
          {
            echo "## probe"
            echo '```'
            uname -a
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_HOME" || true
            ls "$ANDROID_HOME/ndk" || true
            ls "$ANDROID_HOME/platforms" || true
            ls "$ANDROID_HOME/cmdline-tools" || true
            java -version 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - name: rust
        run: |
          cargo --version; rustc --version
          { echo '```'; cargo --version; rustc --version; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
