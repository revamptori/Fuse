name: CI
on:
  push:
    branches: ["arena/5a35d0f9-fuse", main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  rust:
    name: Rust engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: format (apply, so diffs are visible + committed back by hand)
        run: cd rust && cargo fmt --all
      - name: engine check (clippy, tests, bench)
        run: ./scripts/ci-rust.sh
      - name: upload formatted sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt
          path: rust/**/*.rs
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$([ "${{ job.status }}" = success ] && echo pass || echo fail)
          ./scripts/ci-report.sh rust "Rust engine (clippy/tests/bench)" ci-rust.log "$status"
