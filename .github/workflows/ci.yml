name: CI
on:
  push:
    branches: ["arena/5a35d0f9-fuse", main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  rust:
    name: Rust engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: engine check (fmt, clippy, tests, bench)
        run: ./scripts/ci-rust.sh
      - name: commit formatting fixes (if any)
        if: always()
        run: ./scripts/ci-autofix.sh
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$([ "${{ job.status }}" = success ] && echo pass || echo fail)
          ./scripts/ci-report.sh rust "Rust engine (fmt/clippy/tests/bench)" ci-rust.log "$status"
      - name: report bench numbers to docs
        if: always()
        run: |
          if grep -q 'fuss-bench' ci-rust.log 2>/dev/null; then
            python3 scripts/bench-to-markdown.py ci-rust.log docs/BENCHMARKS.md
          fi
