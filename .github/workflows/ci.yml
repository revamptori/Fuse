name: CI
on:
  push:
    branches: ["arena/5a35d0f9-fuse", main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  CARGO_TERM_COLOR: never

jobs:
  rust:
    name: Rust engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: engine check (fmt, clippy, tests, bench)
        run: ./scripts/ci-rust.sh
      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$([ "${{ job.status }}" = success ] && echo pass || echo fail)
          ./scripts/ci-report.sh rust "Rust engine (fmt/clippy/tests/bench)" ci-rust.log "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-logs
          path: ci-rust.log
          if-no-files-found: ignore
